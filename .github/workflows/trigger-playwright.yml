name: Trigger Playwright Automation

on:
  push:
    branches:
      - main

jobs:
  trigger-playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render Deployment
        run: sleep 60

      - name: Trigger Automation Repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ravindra-agnihotri/automation_playground_playwright/dispatches \
            -d '{"event_type":"run-smoke-tests"}'