<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts Playground</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .container{
            width:90%;
            max-width:1000px;
            margin:30px auto;
        }

        .card{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        button{
            padding:10px 20px;
            margin:5px;
            cursor:pointer;
            border:none;
            border-radius:5px;
            background:#1976d2;
            color:white;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#f1f8e9;
            border-radius:5px;
            display:none;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Alerts Playground</h1>

    <div class="card">
        <h3>Simple Alert</h3>
        <button id="simpleAlertBtn">
            Open Alert
        </button>
    </div>

    <div class="card">
        <h3>Confirmation Alert</h3>
        <button id="confirmAlertBtn">
            Open Confirm
        </button>
    </div>

    <div class="card">
        <h3>Prompt Alert</h3>
        <button id="promptAlertBtn">
            Open Prompt
        </button>
    </div>

    <div class="card">
        <h3>Delayed Alert (5 Seconds)</h3>
        <button id="delayedAlertBtn">
            Open Delayed Alert
        </button>
    </div>

    <div class="card">
        <h3>Result</h3>
        <div id="result"></div>
    </div>

</div>
<script src="../js/app.js"></script>
<script src="../js/alerts.js"></script>

</body>
</html>
