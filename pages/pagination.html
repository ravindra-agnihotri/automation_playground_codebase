<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Pagination Playground</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .container{
            width:95%;
            max-width:1200px;
            margin:30px auto;
        }

        .card{
            background:#fff;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#1976d2;
            color:white;
        }

        .pagination{
            margin-top:20px;
        }

        button{
            padding:8px 15px;
            margin:2px;
            cursor:pointer;
        }

        select{
            padding:8px;
        }

        .active{
            background:#1976d2;
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Pagination Playground</h1>

    <div class="card">

        <h3>Employee Records</h3>

        <p>

            Total Records:

            <span id="recordCount">

0

</span>

        </p>

        <label>

            Page Size

            <select id="pageSize">

                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>

            </select>

        </label>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Department</th>

            </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

        <div class="pagination">

            <button id="firstBtn">
                First
            </button>

            <button id="prevBtn">
                Previous
            </button>

            <span id="pageNumbers">
</span>

            <button id="nextBtn">
                Next
            </button>

            <button id="lastBtn">
                Last
            </button>

        </div>

        <p>

            Current Page:

            <span id="currentPage">

1

</span>

        </p>

    </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/pagination.js"></script>

</body>
</html>
