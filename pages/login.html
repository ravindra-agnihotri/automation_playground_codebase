<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Playground</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .container{
            width:400px;
            margin:80px auto;
        }

        .card{
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
        }

        .success{
            color:green;
        }

        .error{
            color:red;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Login</h2>

        <input
                id="username"
                placeholder="Username">

        <input
                id="password"
                type="password"
                placeholder="Password">

        <label>
            <input
                    type="checkbox"
                    id="rememberMe">
            Remember Me
        </label>

        <button id="loginBtn">

            Login

        </button>

        <p>
            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </p>

        <div id="message"></div>

    </div>

</div>

<script>

    const users = {

        admin:{
            password:"admin123",
            role:"ADMIN"
        },

        tester:{
            password:"test123",
            role:"QA"
        },

        locked:{
            password:"locked123",
            role:"USER",
            locked:true
        }

    };

    document
        .getElementById("loginBtn")
        .onclick = ()=>{

        const username =
            document
                .getElementById("username")
                .value;

        const password =
            document
                .getElementById("password")
                .value;

        const user =
            users[username];

        const msg =
            document
                .getElementById("message");

        if(!user){

            msg.innerHTML =
                '<span class="error">Invalid User</span>';

            return;
        }

        if(user.locked){

            msg.innerHTML =
                '<span class="error">Account Locked</span>';

            return;
        }

        if(user.password !== password){

            msg.innerHTML =
                '<span class="error">Invalid Password</span>';

            return;
        }

        sessionStorage.setItem(
            "user",
            username
        );

        sessionStorage.setItem(
            "role",
            user.role
        );

        window.location.href =
            "dashboard.html";

    };

</script>

</body>
</html>
