<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJAX Playground</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .container{
            width:95%;
            max-width:1200px;
            margin:30px auto;
        }

        .card{
            background:#fff;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        button{
            padding:10px 15px;
            margin:5px;
            cursor:pointer;
        }

        input{
            width:300px;
            padding:10px;
        }

        .spinner{
            display:none;
            width:40px;
            height:40px;
            border:5px solid #ddd;
            border-top:5px solid #1976d2;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        .success{
            color:green;
            font-weight:bold;
        }

        .error{
            color:red;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>AJAX Loader Playground</h1>

    <!-- Load Users -->

    <div class="card">

        <h3>Load Users (Simulated API)</h3>

        <button id="loadUsersBtn">

            Load Users

        </button>

        <div
                id="spinner"
                class="spinner">
        </div>

        <div id="status"></div>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
            </tr>
            </thead>

            <tbody id="userTableBody">
            </tbody>

        </table>

    </div>

    <!-- Search -->

    <div class="card">

        <h3>AJAX Search</h3>

        <input
                id="searchBox"
                placeholder="Search user">

        <button id="searchBtn">

            Search

        </button>

        <div id="searchResult"></div>

    </div>

    <!-- Retry -->

    <div class="card">

        <h3>Retry Request</h3>

        <button id="retryBtn">

            Call Service

        </button>

        <div id="retryResult"></div>

    </div>

    <!-- Lazy Load -->

    <div class="card">

        <h3>Lazy Loading</h3>

        <button id="lazyLoadBtn">

            Load More

        </button>

        <div id="lazyContent"></div>

    </div>

    <!-- Stale Element -->

    <div class="card">

        <h3>Stale Element Simulation</h3>

        <button id="replaceBtn">

            Replace Element

        </button>

        <p id="replaceableText">

            Original Element

        </p>

    </div>

</div>
<script src="../js/app.js"></script>
<script src="../js/ajax.js"></script>

</body>
</html>
