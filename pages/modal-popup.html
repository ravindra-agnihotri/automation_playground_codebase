<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Playground</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .container{
            width:90%;
            margin:30px auto;
        }

        .card{
            background:#fff;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        button{
            padding:10px 15px;
            cursor:pointer;
            margin:5px;
        }

        .modal{
            display:none;
            position:fixed;
            z-index:1000;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.6);
        }

        .modal-content{
            background:white;
            width:500px;
            max-width:90%;
            margin:100px auto;
            padding:20px;
            border-radius:10px;
            position:relative;
        }

        .close{
            position:absolute;
            top:10px;
            right:15px;
            font-size:24px;
            cursor:pointer;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        .success{
            color:green;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Modal Popup Playground</h1>

    <div class="card">

        <button id="openLoginModal">
            Open Login Modal
        </button>

        <button id="openConfirmModal">
            Open Confirmation Modal
        </button>

        <button id="openDynamicModal">
            Open Dynamic Modal
        </button>

    </div>

</div>

<!-- LOGIN MODAL -->

<div id="loginModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2>Login Form</h2>

        <input
                id="username"
                placeholder="Username">

        <input
                id="password"
                type="password"
                placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <div id="loginResult"></div>

    </div>

</div>

<!-- CONFIRM MODAL -->

<div id="confirmModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2>Delete Record?</h2>

        <p>Are you sure you want to delete?</p>

        <button id="confirmYes">
            Yes
        </button>

        <button id="confirmNo">
            No
        </button>

    </div>

</div>

<!-- DYNAMIC MODAL -->

<div id="dynamicModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2>Dynamic Content</h2>

        <div id="dynamicContent">
            Loading...
        </div>

    </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/modal.js"></script>

</body>
</html>
