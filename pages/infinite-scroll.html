<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Infinite Scroll Playground</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .container{
            width:90%;
            max-width:1000px;
            margin:30px auto;
        }

        .card{
            background:#fff;
            padding:15px;
            margin-bottom:15px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        .item{
            padding:15px;
            border-bottom:1px solid #ddd;
        }

        .spinner{
            display:none;
            text-align:center;
            font-weight:bold;
            padding:20px;
        }

        .end-message{
            display:none;
            text-align:center;
            color:green;
            font-weight:bold;
            padding:20px;
        }

        #scrollTopBtn{
            position:fixed;
            bottom:20px;
            right:20px;
            display:none;
            padding:10px 15px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Infinite Scroll Playground</h1>

    <div class="card">

        <div id="content">

        </div>

        <div id="spinner"
             class="spinner">

            Loading More Records...

        </div>

        <div id="endMessage"
             class="end-message">

            No More Records Available

        </div>

    </div>

</div>

<button id="scrollTopBtn">

    Top

</button>
<script src="../js/app.js"></script>
<script src="../js/infinite-scroll.js"></script>
</body>
</html>
