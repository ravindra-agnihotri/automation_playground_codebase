<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Playground</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .page-container{
            width:90%;
            max-width:1000px;
            margin:30px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .row{
            display:flex;
            gap:20px;
        }

        .col{
            flex:1;
        }

        .skills,
        .gender{
            display:flex;
            gap:20px;
            margin-top:10px;
        }

        .btn{
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .submit-btn{
            background:#28a745;
            color:white;
        }

        .reset-btn{
            background:#dc3545;
            color:white;
        }

        .result{
            margin-top:20px;
            padding:15px;
            display:none;
            background:#d4edda;
            border-radius:5px;
        }

    </style>

</head>
<body>

<div class="page-container">

    <h1>Forms Playground</h1>

    <form id="registrationForm">

        <div class="row">

            <div class="col">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName">
                </div>
            </div>

            <div class="col">
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName">
                </div>
            </div>

        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile">
        </div>

        <div class="form-group">
            <label>Country</label>
            <select id="country">
                <option value="">Select Country</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
                <option>Australia</option>
            </select>
        </div>

        <div class="form-group">
            <label>Technology</label>

            <select id="technology" multiple size="5">
                <option>Java</option>
                <option>Spring Boot</option>
                <option>Selenium</option>
                <option>Playwright</option>
                <option>React</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" id="genderMale" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" id="genderFemale" name="gender">
                    Female
                </label>
            </div>

        </div>

        <div class="form-group">
            <label>Skills</label>

            <div class="skills">

                <label>
                    <input type="checkbox" id="javaSkill">
                    Java
                </label>

                <label>
                    <input type="checkbox" id="springSkill">
                    Spring
                </label>

                <label>
                    <input type="checkbox" id="seleniumSkill">
                    Selenium
                </label>

                <label>
                    <input type="checkbox" id="playwrightSkill">
                    Playwright
                </label>

            </div>

        </div>

        <div class="form-group">
            <label>Birth Date</label>
            <input type="date" id="birthDate">
        </div>

        <div class="form-group">
            <label>Joining Time</label>
            <input type="time" id="joiningTime">
        </div>

        <div class="form-group">
            <label>Favorite Color</label>
            <input type="color" id="favColor">
        </div>

        <div class="form-group">
            <label>Experience (Years)</label>
            <input type="range"
                   id="experience"
                   min="0"
                   max="20"
                   value="5">
        </div>

        <div class="form-group">
            <label>Upload Resume</label>
            <input type="file" id="resumeUpload">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea id="address" rows="4"></textarea>
        </div>

        <button type="button"
                id="submitBtn"
                class="btn submit-btn">
            Submit
        </button>

        <button type="reset"
                id="resetBtn"
                class="btn reset-btn">
            Reset
        </button>

    </form>

    <div class="result" id="result">
        Form Submitted Successfully
    </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/forms.js"></script>

</body>
</html>
